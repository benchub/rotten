# observed-postgres's pg_hba.conf, dev stack only. The compose command points
# hba_file here, so it applies to an existing data volume too, where the
# image's init doesn't rerun. It's the postgres image's default plus
# streaming replication for the replicator role, which observed-replica
# uses. The default allows replication from localhost only.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     replicator      all                     scram-sha-256
host    all             all             all                     scram-sha-256
