services:
  observed-postgres:
    image: postgres:18
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_planning=on
      # Lets observed-replica stream from here; see observed-pg_hba.conf.
      - -c
      - hba_file=/etc/rotten/observed-pg_hba.conf
      # Caps the WAL the replica's slot holds while the replica is stopped.
      - -c
      - max_slot_wal_keep_size=1GB
    environment:
      POSTGRES_DB: observed
      POSTGRES_PASSWORD: postgres
    volumes:
      - observed-data:/var/lib/postgresql
      - ./observed-init.sql:/docker-entrypoint-initdb.d/001-observed.sql:ro
      - ./observed-pg_hba.conf:/etc/rotten/observed-pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d observed"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      observed:
        aliases:
          - observed-db

  # A streaming replica of observed-postgres. Its entrypoint sets up the
  # replication role and slot on the primary and clones it when needed, so
  # it works on an existing observed-data volume. See dev/README.md.
  observed-replica:
    image: postgres:18
    entrypoint:
      - sh
      - /rotten/observed-replica-entrypoint.sh
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - hot_standby_feedback=on
      - -c
      - primary_conninfo=host=observed-db port=5432 user=replicator password=replicator application_name=observed-replica
      - -c
      - primary_slot_name=observed_replica
    environment:
      POSTGRES_PASSWORD: postgres
      REPLICA_PRIMARY_HOST: observed-db
      REPLICA_PRIMARY_PASSWORD: postgres
    volumes:
      - observed-replica-data:/var/lib/postgresql
      - ./observed-replica-entrypoint.sh:/rotten/observed-replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d observed"]
      interval: 2s
      timeout: 2s
      retries: 60
    depends_on:
      observed-postgres:
        condition: service_healthy
    networks:
      observed:
        aliases:
          - observed-replica-db

  rotten-db:
    build:
      context: ..
      dockerfile: docker/rotten-db.Dockerfile
    image: rotten-dev-db:18
    environment:
      POSTGRES_DB: rotten
      POSTGRES_PASSWORD: postgres
    volumes:
      - rotten-data:/var/lib/postgresql
      - ./rotten-db-init.sql:/docker-entrypoint-initdb.d/001-rotten.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rotten"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      core:
        aliases:
          - rotten-db

  certs:
    build:
      context: ..
      dockerfile: docker/test.Dockerfile
    image: rotten-dev-go:1.27
    network_mode: none
    working_dir: /src
    # Every Go service builds its binary under /tmp, which is per container,
    # then execs it, so the program is PID 1 and gets compose's SIGTERM:
    # `go run` doesn't pass it on. The shared go-build cache keeps rebuilds
    # quick.
    command:
      - sh
      - -ec
      - go build -o /tmp/gen-test-certs ./dev/cmd/gen-test-certs && exec /tmp/gen-test-certs -out /certs -host rotten-server,localhost,127.0.0.1
    volumes:
      - ..:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - test-certs:/certs

  server-migrate:
    image: rotten-dev-go:1.27
    working_dir: /src
    command:
      - sh
      - -ec
      - go build -o /tmp/rotten-server ./cmd/rotten-server && exec /tmp/rotten-server migrate
    environment:
      ROTTEN_OWNER_DSN: postgres://rotten_owner:rotten_owner@rotten-db:5432/rotten?sslmode=disable
    volumes:
      - ..:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      rotten-db:
        condition: service_healthy
    networks:
      - core

  server:
    image: rotten-dev-go:1.27
    working_dir: /src
    command:
      - sh
      - -ec
      - go build -o /tmp/rotten-server ./cmd/rotten-server && exec /tmp/rotten-server serve -listen :8443 -tls-cert /certs/server.pem -tls-key /certs/server-key.pem
    environment:
      ROTTEN_SERVER_DSN: postgres://rotten_ingest:rotten_ingest@rotten-db:5432/rotten?sslmode=disable
    ports:
      - "8443:8443"
    volumes:
      - ..:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - test-certs:/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      server-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - go
        - run
        - ./dev/cmd/healthcheck
        - -url
        - https://localhost:8443/healthz
        - -ca
        - /certs/ca.pem
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    networks:
      edge:
        aliases:
          - rotten-server
      core:
        aliases:
          - rotten-server

  worker-key:
    image: rotten-dev-go:1.27
    working_dir: /src
    command:
      - bash
      - -e
      - -o
      - pipefail
      - -c
      - |
        if [ -s /worker-secrets/pass.key ]; then exit 0; fi
        go build -o /tmp/rotten-server ./cmd/rotten-server
        /tmp/rotten-server keys create -dsn "$$ROTTEN_ADMIN_DSN" --fqdn observed-postgres dev-worker | tail -n 1 > /worker-secrets/pass.key.new
        test -s /worker-secrets/pass.key.new
        mv /worker-secrets/pass.key.new /worker-secrets/pass.key
    environment:
      ROTTEN_ADMIN_DSN: postgres://rotten_owner:rotten_owner@rotten-db:5432/rotten?sslmode=disable
    volumes:
      - ..:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - worker-secrets:/worker-secrets
    depends_on:
      server-migrate:
        condition: service_completed_successfully
    networks:
      - core

  worker:
    image: rotten-dev-go:1.27
    working_dir: /src
    command:
      - sh
      - -ec
      - go build -o /tmp/rotten-worker ./cmd/rotten-worker && exec /tmp/rotten-worker -config /src/dev/worker.json
    volumes:
      - ..:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - test-certs:/certs:ro
      - worker-secrets:/worker-secrets:ro
      - worker-state:/state
    depends_on:
      observed-postgres:
        condition: service_healthy
      server:
        condition: service_healthy
      worker-key:
        condition: service_completed_successfully
    networks:
      observed:
        aliases:
          - rotten-worker
      edge:
        aliases:
          - rotten-worker

  # The replica's pass key, pinned to the replica worker's FQDN.
  worker-replica-key:
    image: rotten-dev-go:1.27
    working_dir: /src
    command:
      - bash
      - -e
      - -o
      - pipefail
      - -c
      - |
        if [ -s /worker-secrets/pass.key ]; then exit 0; fi
        go build -o /tmp/rotten-server ./cmd/rotten-server
        /tmp/rotten-server keys create -dsn "$$ROTTEN_ADMIN_DSN" --fqdn observed-replica dev-worker-replica | tail -n 1 > /worker-secrets/pass.key.new
        test -s /worker-secrets/pass.key.new
        mv /worker-secrets/pass.key.new /worker-secrets/pass.key
    environment:
      ROTTEN_ADMIN_DSN: postgres://postgres:postgres@rotten-db:5432/rotten?sslmode=disable
    volumes:
      - ..:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - worker-replica-secrets:/worker-secrets
    depends_on:
      server-migrate:
        condition: service_completed_successfully
    networks:
      - core

  # The replica's worker (Role replica): same project, environment and
  # cluster as the primary's, its own FQDN, key and state.
  worker-replica:
    image: rotten-dev-go:1.27
    working_dir: /src
    command:
      - sh
      - -ec
      - go build -o /tmp/rotten-worker ./cmd/rotten-worker && exec /tmp/rotten-worker -config /src/dev/worker-replica.json
    volumes:
      - ..:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - test-certs:/certs:ro
      - worker-replica-secrets:/worker-secrets:ro
      - worker-replica-state:/state
    depends_on:
      observed-replica:
        condition: service_healthy
      server:
        condition: service_healthy
      worker-replica-key:
        condition: service_completed_successfully
    networks:
      observed:
        aliases:
          - rotten-worker-replica
      edge:
        aliases:
          - rotten-worker-replica

  # Application-like load with marginalia comments on the observed Postgres,
  # so the controller, action and job views have data. See dev/README.md.
  traffic:
    image: rotten-dev-go:1.27
    working_dir: /src
    # Built, then exec'd, like the other Go services (see certs).
    command:
      - sh
      - -ec
      - go build -o /tmp/traffic ./dev/cmd/traffic && exec /tmp/traffic
    environment:
      TRAFFIC_ADMIN_DSN: postgres://postgres:postgres@observed-db:5432/observed?sslmode=disable
      TRAFFIC_RATE: ${TRAFFIC_RATE:-1}
      TRAFFIC_EPISODE_EVERY: ${TRAFFIC_EPISODE_EVERY:-15m}
      TRAFFIC_REPLICA_DSN: postgres://postgres:postgres@observed-replica-db:5432/observed?sslmode=disable
    volumes:
      - ..:/src:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      observed-postgres:
        condition: service_healthy
      observed-replica:
        condition: service_healthy
    networks:
      - observed

  ui:
    build:
      context: ../ui
      dockerfile: dev.Dockerfile
    # No platform pin: built for the Docker host's native platform, so arm64
    # hosts run Chromium without emulation. The tag changed from
    # rotten-dev-ui:3.4 (formerly amd64-only) so an old image isn't reused.
    image: rotten-dev-ui:3.4-native
    working_dir: /app
    # Build app/assets/builds/tailwind.css (gitignored) before serving, so the
    # first page load has CSS. exec keeps rails server as PID 1's process.
    # The ui-css service rebuilds it on every change.
    command:
      - bash
      - -c
      - bin/rails tailwindcss:build && exec bin/rails server -b 0.0.0.0
    environment: &ui-env
      DATABASE_URL: postgres://rotten_ui:rotten_ui@rotten-db:5432/rotten?sslmode=disable
      SECRET_KEY_BASE: development-secret-key-base
      # Offline OIDC: /login offers fake viewer and admin personas. Development only.
      ROTTEN_UI_AUTH: oidc
      OMNIAUTH_FAKE: "1"
      ROTTEN_UI_VIEWER_GROUP: rotten-dev-viewers
      ROTTEN_UI_ADMIN_GROUP: rotten-dev-admins
    ports:
      - "3000:3000"
    volumes:
      - ../ui:/app
      # The report SQL; the UI reads it from /reports (Rails.root.parent).
      - ../reports:/reports:ro
    depends_on:
      server-migrate:
        condition: service_completed_successfully
    networks:
      core:
        aliases:
          - rotten-ui
      ui-public:
        aliases:
          - rotten-ui

  # Tailwind watcher: rebuilds app/assets/builds/tailwind.css when a view,
  # helper, JS controller or app/assets/tailwind/*.css changes, so a browser
  # refresh shows the new CSS. [always] keeps it running without a TTY.
  ui-css:
    build:
      context: ../ui
      dockerfile: dev.Dockerfile
    image: rotten-dev-ui:3.4-native
    working_dir: /app
    command:
      - bin/rails
      - tailwindcss:watch[always]
    # Booting Rails for the task needs the app's env and the report SQL, but
    # not the database, so the watcher gets no network at all.
    environment: *ui-env
    volumes:
      - ../ui:/app
      - ../reports:/reports:ro
    network_mode: none
    depends_on:
      ui:
        condition: service_started

networks:
  observed:
    internal: true
  edge:
  core:
    internal: true
  ui-public:

volumes:
  observed-data:
  rotten-data:
  go-mod:
  go-build:
  test-certs:
  worker-secrets:
  worker-state:
  observed-replica-data:
  worker-replica-secrets:
  worker-replica-state:
