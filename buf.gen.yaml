# Plugins run through `go tool`, so their versions come from the tool block
# in go.mod and nothing needs to be installed.
version: v2
clean: true
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen
    opt: paths=source_relative
